<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>學習島．國中自學筆記</title>
<meta name="description" content="一塊島，一個科目。點一座島，走進它的重點筆記。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2630'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23f6f4ee' font-family='serif' font-weight='900'%3E學%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
:root{--ink:#2a2622;--muted:#7a716a;--paper:#fffaf5;--line:#eadfd5;--accent:#e2673c;--sea:#6cc0cf;--card:rgba(255,250,245,.92);--shadow:0 10px 30px -12px rgba(60,40,20,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7cc7d3;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
[hidden]{display:none!important}
canvas#sea{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:18px;box-shadow:var(--shadow)}
.pill{border:0;background:var(--card);backdrop-filter:blur(10px);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);white-space:nowrap}
.pill:hover{background:#fff}
.pill.dark{background:var(--ink);color:#fff}
/* 左上品牌 */
#brand{position:fixed;left:20px;top:20px;padding:14px 18px;display:flex;gap:14px;align-items:center;z-index:5;text-decoration:none;color:inherit}
#brand .big{font-weight:900;font-size:30px;line-height:.95;color:var(--accent);letter-spacing:-.01em}
#brand .sm{font-weight:900;font-size:17px;line-height:1.35}
#brand .sm b{color:var(--accent)}
/* 上方工具列 */
#tools{position:fixed;top:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
/* 島的標籤 */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:#fff;border-radius:999px;padding:5px 12px 5px 8px;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 4px 14px -4px rgba(0,0,0,.35);display:flex;align-items:center;gap:6px;transition:opacity .2s,background .2s;border:0}
.lb i{font-style:normal;font-size:11px;color:var(--c);font-weight:900;min-width:16px;text-align:center}
.lb.soon{background:#f1ece6;color:var(--muted)}
.lb.soon::after{content:"整理中";font-size:11px;font-weight:500;background:#e2d9cf;border-radius:999px;padding:0 6px}
.lb:hover,.lb.on{background:var(--ink);color:#fff}
.lb.on i,.lb:hover i{color:#fff}
.lb.hub{background:var(--accent);color:#fff;font-size:13px}
/* 右側清單 */
#list{position:fixed;right:0;top:0;bottom:0;width:340px;padding:26px 20px 20px;z-index:6;border-radius:24px 0 0 24px;overflow:auto;transition:transform .35s}
#list.closed{transform:translateX(105%)}
#list .k{font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}
#list h2{margin:6px 0 4px;font-size:26px;font-weight:900}
#list p.s{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.6}
#list .x{position:absolute;right:14px;top:14px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
.li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer}
.li:hover{background:rgba(0,0,0,.03)}
.li .n{font-weight:900;color:var(--c);font-size:15px}
.li b{display:block;font-size:15.5px}
.li small{display:block;color:var(--muted);font-size:12px}
.li .t{font-size:12px;color:var(--muted)}
.li.soon b{color:var(--muted)}
/* 島的詳細卡片 */
#info{position:fixed;left:20px;bottom:20px;width:min(380px,calc(100vw - 40px));max-height:calc(100vh - 140px);overflow:auto;padding:20px 20px 16px;z-index:7}
#info .k{font-size:11px;letter-spacing:.18em;color:var(--c);font-weight:700}
#info h3{margin:4px 0 2px;font-size:26px;font-weight:900}
#info .en{color:var(--muted);font-size:13px}
#info p{font-size:14px;line-height:1.65;margin:10px 0}
#info .stats{display:flex;gap:16px;margin:10px 0 12px}
#info .stats b{display:block;font-size:20px;font-weight:900;color:var(--c)}
#info .stats span{font-size:12px;color:var(--muted)}
#info .units{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
#info .units a{display:flex;gap:8px;text-decoration:none;color:inherit;font-size:13.5px;padding:5px 8px;border-radius:8px}
#info .units a:hover{background:rgba(0,0,0,.05)}
#info .units a i{font-style:normal;font-weight:900;color:var(--c);min-width:20px}
#info .go{position:sticky;bottom:0;box-shadow:0 -8px 16px 4px var(--card);display:flex;justify-content:center;align-items:center;gap:6px;width:100%;padding:12px;border-radius:12px;background:var(--c);color:#fff;font-weight:700;text-decoration:none;font-size:15px}
#info .hint2{font-size:12.5px;color:var(--muted);margin:2px 0 6px}
#info .units button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;border:0;background:transparent;cursor:pointer;font-size:13.5px;padding:5px 8px;border-radius:8px}
#info .units button:hover{background:rgba(0,0,0,.05)}
#info .units button i{font-style:normal;font-weight:900;color:var(--c);min-width:24px}
#info .units button small{color:var(--muted);font-size:11.5px;margin-left:6px}
#info h3.lmt{font-size:22px;line-height:1.35}
#info .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
#info .chips span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:rgba(0,0,0,.05);border-left:3px solid var(--c)}
#info .back{display:block;width:100%;margin-top:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13.5px;padding:6px}
#info .prog{display:flex;align-items:center;gap:10px;margin:4px 0 8px;font-size:13px}
#info .prog .bar{flex:1;height:8px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}
#info .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#f4c95d);border-radius:999px}
#info .prog b{color:var(--c)}
#info .units button em{font-style:normal;margin-left:auto;color:#d4a20a;font-weight:900}
#info .done{color:#2f8a63;font-weight:700}
#info .new{color:#e2673c;font-weight:700}
#tip{position:fixed;left:0;top:0;z-index:8;pointer-events:none;background:#fff;border-radius:10px;padding:6px 12px;font-size:13.5px;box-shadow:0 6px 18px -6px rgba(0,0,0,.35);white-space:nowrap}
#info .x{position:absolute;right:12px;top:12px;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--muted)}
/* 導覽 */
#tour{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(80,70,60,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
#tour .card{width:min(440px,100%);padding:30px 30px 26px;background:#fffaf5}
#tour .k{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}
#tour h3{margin:14px 0 12px;font-size:26px;font-weight:900}
#tour p{margin:0 0 22px;color:var(--muted);font-size:14.5px;line-height:1.75}
#tour .row{display:flex;justify-content:space-between}
#tour .row button{border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;border:1px solid var(--line);background:#fff}
#tour .row button.next{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 3px #fffaf5,0 0 0 5px var(--accent)}
#loading{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#7cc7d3;color:#fff;font-weight:700;font-size:16px;transition:opacity .6s}
#loading.done{opacity:0;pointer-events:none}
#hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;font-size:13px;padding:7px 14px;color:var(--muted)}
/* 島民模式 */
body.walking #list,body.walking #hint,body.walking #bList,body.walking #bHome,body.walking #bWalk{display:none!important}
#walkHud{position:fixed;left:20px;top:122px;z-index:6;display:flex;gap:8px;flex-wrap:wrap}
#joy{position:fixed;left:28px;bottom:28px;width:136px;height:136px;border-radius:50%;z-index:6;background:rgba(255,250,245,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.8);touch-action:none;cursor:grab}
#joy::before{content:"";position:absolute;inset:30%;border-radius:50%;border:2px dashed rgba(42,38,34,.18)}
#joy i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb08f,var(--accent));box-shadow:0 6px 14px -4px rgba(140,50,20,.6),inset 0 -3px 0 rgba(0,0,0,.12);transition:transform .08s}
#joy.on{cursor:grabbing}
#wHelp{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:4;font-size:13px;padding:7px 14px;color:var(--muted)}
#near{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:7;width:min(400px,calc(100vw - 220px));padding:14px 16px;border-left:5px solid var(--c)}
#near .k{font-size:11px;letter-spacing:.14em;color:var(--c);font-weight:700}
#near b{display:block;font-size:18px;font-weight:900;margin:2px 0}
#near small{color:var(--muted);font-size:12.5px}
#near .acts{display:flex;gap:8px;margin-top:10px}
#near .acts a,#near .acts button{flex:1;text-align:center;border:0;border-radius:10px;padding:10px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none}
#near .acts a{background:var(--c);color:#fff}
#near .acts button{background:rgba(0,0,0,.06)}
#near .done{color:#2f8a63;font-weight:700}
#maker{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(80,70,60,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
#maker .card{width:min(520px,100%);padding:24px;background:#fffaf5;max-height:calc(100vh - 32px);overflow:auto}
#maker .k{font-family:ui-monospace,Menlo,monospace;font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}
#maker h3{margin:8px 0 14px;font-size:24px;font-weight:900}
#maker .mk{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:start}
#mkPrev{width:130px;height:173px;background:linear-gradient(#d8f0f2,#bfe4ea);border-radius:16px}
#maker label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
#maker input{display:block;width:100%;margin-top:4px;font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
#maker .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
#maker .row span{font-size:13px;color:var(--muted);width:36px}
#maker .row button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0;font-size:13px;line-height:1}
#maker .row button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
#maker .btns{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
#maker .btns button{border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;border:1px solid var(--line);background:#fff}
#maker .btns .go{background:var(--accent);color:#fff;border-color:var(--accent);flex:1}
@media (max-width:760px){
  #walkHud{top:auto;bottom:16px;right:12px;left:auto;flex-direction:column;align-items:flex-end}
  body.walking #tools{display:none}
  #joy{left:18px;bottom:22px;width:124px;height:124px}
  #wHelp{display:none}
  #near{left:12px;right:12px;width:auto;transform:none;bottom:auto;top:92px}
  #maker .mk{grid-template-columns:1fr}
  #mkPrev{margin:0 auto;display:block}
}
#nogl{position:fixed;inset:0;z-index:40;background:var(--paper);padding:24px;overflow:auto}
#nogl a{display:block;margin:8px 0;font-size:18px;color:var(--ink)}
@media (max-width:760px){
  #brand{left:12px;top:12px;padding:10px 12px;gap:10px}
  #brand .big{font-size:20px}
  #brand .sm{font-size:13px}
  #tools{top:auto;bottom:16px;left:12px;transform:none}
  #tools .pill{padding:8px 11px;font-size:13px}
  #list{width:100%;top:auto;height:62vh;border-radius:24px 24px 0 0}
  #list.closed{transform:translateY(105%)}
  #info{left:12px;right:12px;bottom:12px;width:auto;max-height:46vh;padding:16px 16px 12px}
  #info h3{font-size:22px}
  #info p{display:none}
  #info .chips{max-height:84px;overflow:auto}
  #info .stats{margin:6px 0 8px}
  #info .units button{padding:4px 6px}
  #hint{display:none}
  .lb{font-size:12px;padding:4px 10px 4px 7px}
}
</style>
<script src="../assets/subjects.js"></script>
<script src="../data/summary.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="sea"></canvas>
<div id="labels"></div>

<a id="brand" class="card" href="../" title="回一般首頁">
  <span class="big">STUDY<br>ISLAND.</span>
  <span class="sm">國中自學筆記<br><b>學習</b>島</span>
</a>
<nav id="tools">
  <button class="pill dark" id="bWalk">🧍 化身島民</button>
  <button class="pill" id="bHome">⌂ 全景</button>
  <button class="pill" id="bList">☰ 清單</button>
  <button class="pill" id="bTour" aria-label="導覽說明">?</button>
  <a class="pill" href="../">一般版</a>
</nav>
<!-- 島民模式 -->
<div id="walkHud" hidden>
  <button class="pill" id="wExit">✕ 離開島民模式</button>
  <button class="pill" id="wSkin">🎨 換造型</button>
</div>
<div id="joy" hidden aria-label="移動搖桿"><i></i></div>
<div id="wHelp" class="card" hidden>拖曳左下圓點走路 · 拖曳畫面轉視角 · 也可用 WASD／方向鍵 · 點物件會自動走過去</div>
<div id="near" class="card" hidden aria-live="polite"></div>
<div id="maker" hidden>
  <div class="card">
    <div class="k">NEW ISLANDER</div>
    <h3>建立你的島民</h3>
    <div class="mk">
      <svg id="mkPrev" viewBox="0 0 120 160" aria-hidden="true"></svg>
      <div class="mkOpts">
        <label>名字<input id="mkName" maxlength="8" placeholder="輸入名字"></label>
        <div class="row" data-k="skin"><span>膚色</span></div>
        <div class="row" data-k="hair"><span>髮色</span></div>
        <div class="row" data-k="shirt"><span>上衣</span></div>
        <div class="row" data-k="pants"><span>褲子</span></div>
        <div class="row" data-k="hat"><span>帽子</span></div>
      </div>
    </div>
    <div class="btns"><button id="mkRand" type="button">🎲 隨機</button><button id="mkGo" class="go" type="button">出發探險 →</button></div>
  </div>
</div>
<div id="hint" class="card">拖曳轉動 · 滾輪縮放 · 點島或島上的物件開始探索</div>

<aside id="list" class="card">
  <button class="x" id="listX" aria-label="關閉">✕</button>
  <div class="k">THE STUDY INDEX</div>
  <h2>把知識，連起來。</h2>
  <p class="s" id="listSub"></p>
  <div id="listBody"></div>
</aside>

<section id="info" class="card" hidden aria-live="polite"></section>

<div id="tour" hidden>
  <div class="card">
    <div class="k" id="tK"></div>
    <h3 id="tH"></h3>
    <p id="tP"></p>
    <div class="row"><button id="tSkip">略過</button><button class="next" id="tNext">下一步 →</button></div>
  </div>
</div>
<div id="loading">學習島正在浮出海面…</div>
<div id="nogl" hidden></div>

<script type="module" src="../assets/island.js"></script>
</body>
</html>
