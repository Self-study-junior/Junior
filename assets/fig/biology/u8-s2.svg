<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" width="780" height="380" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="780" height="380" fill="#fffdf8"/><rect x="40" y="300" width="700" height="60" rx="14" fill="#fbe3ec" stroke="#e98fa6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="318" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="390" dy="0">原核生物界</tspan></text><text x="390" y="342" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="390" dy="0">細菌、藍綠菌（無核膜、無細胞核）</tspan></text><rect x="120" y="220" width="540" height="60" rx="14" fill="#e7e2f6" stroke="#7a5bb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="238" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="390" dy="0">原生生物界</tspan></text><text x="390" y="262" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="390" dy="0">藻類（如矽藻）、原生動物（如草履蟲、變形蟲）、原生菌類</tspan></text><rect x="40" y="30" width="220" height="170" rx="14" fill="#dcefd2" stroke="#2f8a63" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="58" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#2f8a63" font-weight="700"><tspan x="150" dy="0">植物界</tspan></text><text x="150" y="113.1" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="150" dy="0">苔蘚、蕨類</tspan><tspan x="150" dy="16.900000000000002">裸子植物、被子植物</tspan><tspan x="150" dy="16.900000000000002">多細胞、能行光合作用</tspan></text><rect x="280" y="30" width="220" height="170" rx="14" fill="#e3eef8" stroke="#3b6fb6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="390" y="58" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#3b6fb6" font-weight="700"><tspan x="390" dy="0">真菌界</tspan></text><text x="390" y="113.1" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="390" dy="0">黴菌、蕈類、酵母菌</tspan><tspan x="390" dy="16.900000000000002">細胞有細胞壁</tspan><tspan x="390" dy="16.900000000000002">不能行光合作用</tspan></text><rect x="520" y="30" width="220" height="170" rx="14" fill="#fbe9d3" stroke="#e08a2c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="58" font-size="17" text-anchor="middle" dominant-baseline="central" fill="#e08a2c" font-weight="700"><tspan x="630" dy="0">動物界</tspan></text><text x="630" y="113.1" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="630" dy="0">無脊椎動物</tspan><tspan x="630" dy="16.900000000000002">脊椎動物</tspan><tspan x="630" dy="16.900000000000002">多細胞、須攝食</tspan></text><path d="M40 290L740 290" fill="none" stroke="#1f2630" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="776" y="202.2" font-size="12" text-anchor="end" dominant-baseline="central" fill="#7a5bb5" font-weight="400"><tspan x="760" dy="0">真核</tspan><tspan x="760" dy="15.600000000000001">生物</tspan></text><text x="776" y="322.2" font-size="12" text-anchor="end" dominant-baseline="central" fill="#d0505f" font-weight="400"><tspan x="776" dy="0">原核</tspan><tspan x="776" dy="15.600000000000001">生物</tspan></text></svg>