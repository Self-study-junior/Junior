<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="640" height="330" fill="#fffdf8"/><path d="M110 30 L110 260 A40 40 0 0 0 190 260 L190 30" fill="none" stroke="#1f2630" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="111" y="60" width="78" height="110" rx="0" fill="#f7d9a3" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="111" y="170" width="78" height="12" rx="0" fill="#f2efe8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M111 182 L111 260 A39 39 0 0 0 189 260 L189 182Z" fill="#9b1c22" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 60 L80 60 L80 170 L90 170" fill="none" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="115" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700" transform="rotate(-90 62 115)"><tspan x="62" dy="0">血漿</tspan></text><path d="M90 182 L80 182 L80 295 L90 295" fill="none" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="240" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700" transform="rotate(-90 62 240)"><tspan x="62" dy="0">血球</tspan></text><path d="M190 115L236 80" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="115" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="80" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="240" dy="0">血漿（淡黃色液體，約占 55%）</tspan></text><text x="240" y="96.2" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="240" dy="0">約 90% 是水，含養分、二氧化碳、廢物（如尿素）、</tspan><tspan x="240" dy="15.600000000000001">激素和抗體等，負責運輸</tspan></text><path d="M190 176L236 165" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="176" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="165" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="240" dy="0">白血球、血小板（薄薄一層）</tspan></text><text x="240" y="189" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="240" dy="0">白血球：吞噬病原體、產生抗體　血小板：幫助血液凝固</tspan></text><path d="M190 240L236 245" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="190" cy="240" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="245" font-size="15" text-anchor="start" dominant-baseline="central" fill="#9b1c22" font-weight="700"><tspan x="240" dy="0">紅血球（最多）</tspan></text><text x="240" y="269" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="240" dy="0">含血紅素，負責運送氧氣；成熟時沒有細胞核</tspan></text></svg>