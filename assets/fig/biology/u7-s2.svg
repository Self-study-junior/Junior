<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="680" height="300" fill="#fffdf8"/><rect x="138" y="40" width="24" height="200" rx="12" fill="#f4b6c2" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="138" y="72" width="24" height="16" rx="0" fill="#c0303f" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="80" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="124" dy="0">A</tspan></text><rect x="138" y="142" width="24" height="16" rx="0" fill="#3b6fb6" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="150" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="124" dy="0">B</tspan></text><rect x="138" y="192" width="24" height="16" rx="0" fill="#e8b23c" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="124" y="200" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="124" dy="0">d</tspan></text><rect x="198" y="40" width="24" height="200" rx="12" fill="#a9c8ef" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="72" width="24" height="16" rx="0" fill="#c0303f" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="80" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="236" dy="0">a</tspan></text><rect x="198" y="142" width="24" height="16" rx="0" fill="#3b6fb6" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="150" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="236" dy="0">B</tspan></text><rect x="198" y="192" width="24" height="16" rx="0" fill="#e8b23c" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="200" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="236" dy="0">D</tspan></text><text x="180" y="270" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="180" dy="0">一對同源染色體（一條來自父方、一條來自母方）</tspan></text><text x="320" y="61.6" font-size="13" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="320" dy="0">A 與 a：位在同源染色體相同位置，控制同一性狀</tspan><tspan x="320" dy="16.900000000000002">→ 稱為一對等位基因</tspan></text><text x="320" y="140" font-size="13" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="320" dy="0">基因位在染色體上，染色體由 DNA 與蛋白質組成</tspan></text><text x="320" y="191.6" font-size="13" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="320" dy="0">大寫：顯性基因　小寫：隱性基因</tspan><tspan x="320" dy="16.900000000000002">Aa：只表現顯性性狀</tspan></text></svg>