<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="840" height="520" fill="#fffdf8"/><g transform="translate(80 0)"><path d="M271.4 40C271.4 1 328.6 1 328.6 40C328.6 68.6 315.6 84.2 310.4 92L310.4 102.4C352 107.60000000000001 380.6 118 385.8 144L404 300L383.2 302.6L365 170L362.4 300L354.6 482L315.6 482L305.2 313L294.8 313L284.4 482L245.4 482L237.6 300L235 170L216.8 302.6L196 300L214.2 144C219.39999999999998 118 248 107.60000000000001 289.6 102.4L289.6 92C284.4 84.2 271.4 68.6 271.4 40Z" fill="#fbe9dd" stroke="#d9b9a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 92 Q300 105 300 120" fill="none" stroke="#f5a3a3" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 120 L300 200" fill="none" stroke="#e98a8a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 200 C330 190 350 210 345 235 C340 265 300 268 285 255" fill="#f3a2a2" stroke="#c75a5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 215 C240 190 300 192 300 210 C295 235 260 250 220 245Z" fill="#b45a45" stroke="#8b3f2e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/><ellipse cx="262" cy="250" rx="8" ry="6" fill="#5aa24a" stroke="#2f6d2a" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M280 268 C300 262 330 266 345 258" fill="none" stroke="#e8b25c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M235 300 L235 390 L365 390 L365 300 Z" fill="none" stroke="#c9875a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/><path d="M260 310 C330 300 340 320 260 330 C200 340 340 350 260 360 C210 368 340 372 280 380" fill="none" stroke="#f0b5a8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 390 L300 420" fill="none" stroke="#c9875a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 105L184 80" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="105" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="80" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="180" dy="0">口腔</tspan></text><text x="180" y="100" font-size="12" text-anchor="end" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="180" dy="0">唾液腺分泌唾液：澱粉 → 麥芽糖</tspan></text><path d="M300 160L184 160" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="160" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="160" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="180" dy="0">食道</tspan></text><text x="180" y="180" font-size="12" text-anchor="end" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="180" dy="0">蠕動，把食物送入胃</tspan></text><path d="M230 225L184 240" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="230" cy="225" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="240" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="180" dy="0">肝臟</tspan></text><text x="180" y="260" font-size="12" text-anchor="end" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="180" dy="0">分泌膽汁（不含酵素），乳化脂肪</tspan></text><path d="M262 252L184 320" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="262" cy="252" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="180" y="320" font-size="15" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="180" dy="0">膽囊</tspan></text><text x="180" y="340" font-size="12" text-anchor="end" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="180" dy="0">儲存膽汁</tspan></text><path d="M335 225L446 110" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="335" cy="225" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="110" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="450" dy="0">胃</tspan></text><text x="450" y="130" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="450" dy="0">胃液含酸，初步分解蛋白質</tspan></text><path d="M335 262L446 190" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="335" cy="262" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="190" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="450" dy="0">胰臟</tspan></text><text x="450" y="210" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="450" dy="0">胰液可分解澱粉、蛋白質、脂質</tspan></text><path d="M300 345L446 270" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="345" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="270" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="450" dy="0">小腸</tspan></text><text x="450" y="290" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="450" dy="0">腸液；消化與吸收的主要場所</tspan></text><path d="M365 330L446 350" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="365" cy="330" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="350" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="450" dy="0">大腸</tspan></text><text x="450" y="370" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="450" dy="0">吸收水分，形成糞便</tspan></text><path d="M300 418L446 430" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="418" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="430" font-size="15" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="450" dy="0">肛門</tspan></text><text x="450" y="450" font-size="12" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="450" dy="0">排出糞便</tspan></text><text x="340" y="500" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a8a96" font-weight="700"><tspan x="340" dy="0">消化管：口腔→咽→食道→胃→小腸→大腸→肛門　　消化腺：唾液腺、胃腺、肝臟、胰臟、腸腺</tspan></text></g></svg>