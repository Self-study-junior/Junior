<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="780" height="360" fill="#fffdf8"/><rect x="0" y="0" width="780" height="360" rx="0" fill="#eaf3fb" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 300 C200 285 500 290 780 300 L780 360 L0 360Z" fill="#9cc77e" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="90" width="780" height="40" rx="0" fill="#b9a3d9" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/><text x="770" y="110" font-size="12" text-anchor="end" dominant-baseline="central" fill="#7a5bb5" font-weight="700"><tspan x="770" dy="0">溫室氣體：水氣、二氧化碳、甲烷等</tspan></text><circle cx="60" cy="40" r="30" fill="#f7b733" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 60L293.9 283.4" fill="none" stroke="#f2a33a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 290L286 284.7L296 275.5Z" fill="#f2a33a"/><text x="150" y="167.2" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#b5651d" font-weight="700"><tspan x="150" dy="0">太陽輻射</tspan><tspan x="150" dy="15.600000000000001">（短波，可穿透大氣）</tspan></text><path d="M200 170L257.3 26.7" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 20L261.1 32L251 27.9Z" fill="#f2c94c"/><text x="300" y="30" font-size="12" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="300" dy="0">約 30% 被雲、地表反射回太空</tspan></text><path d="M420 290L439.1 132.1" fill="none" stroke="#d0505f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 125L444.1 136.3L433.3 135Z" fill="#d0505f"/><text x="470" y="200" font-size="12" text-anchor="start" dominant-baseline="central" fill="#d0505f" font-weight="700"><tspan x="470" dy="0">地表放出紅外線（長波）</tspan></text><path d="M450 110L497.4 24.7" fill="none" stroke="#d0505f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M500 20L499.7 29L492.5 25Z" fill="#d0505f"/><text x="510" y="40" font-size="12" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="510" dy="0">少部分散失到太空</tspan></text><path d="M470 110L556.7 278.6" fill="none" stroke="#d0505f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M560 285L550.3 278L560 273Z" fill="#d0505f"/><text x="580" y="242.2" font-size="12" text-anchor="start" dominant-baseline="central" fill="#d0505f" font-weight="700"><tspan x="580" dy="0">溫室氣體吸收後</tspan><tspan x="580" dy="15.600000000000001">再放出，使地表增溫</tspan></text><text x="390" y="335" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="390" dy="0">若沒有溫室效應，地表平均溫度約 －18°C；目前約 15°C。溫室氣體增加 → 全球暖化</tspan></text></svg>