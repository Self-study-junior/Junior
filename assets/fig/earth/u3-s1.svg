<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" width="820" height="330" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="820" height="330" fill="#fffdf8"/><rect x="0" y="0" width="820" height="330" rx="0" fill="#121a2b" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-60" cy="120" r="140" fill="#f7b733" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="120" font-size="16" text-anchor="middle" dominant-baseline="central" fill="#5a2e00" font-weight="700"><tspan x="30" dy="0">太陽</tspan></text><circle cx="160" cy="120" r="7" fill="#b7b2a8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="160" dy="0">水星</tspan></text><circle cx="200" cy="120" r="11" fill="#e9c98a" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="200" dy="0">金星</tspan></text><circle cx="240" cy="120" r="12" fill="#4f94cf" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="240" dy="0">地球</tspan></text><circle cx="280" cy="120" r="9" fill="#d0623c" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="280" dy="0">火星</tspan></text><circle cx="350" cy="120" r="34" fill="#d9a877" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="350" dy="0">木星</tspan></text><circle cx="435" cy="120" r="28" fill="#e6cf96" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="435" cy="120" rx="50.4" ry="12.6" fill="none" stroke="#e6cf96" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="435" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="435" dy="0">土星</tspan></text><circle cx="520" cy="120" r="18" fill="#93d6dd" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="520" dy="0">天王星</tspan></text><circle cx="605" cy="120" r="17" fill="#4f7fd8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="605" y="175" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="400"><tspan x="605" dy="0">海王星</tspan></text><rect x="130" y="210" width="230" height="110" rx="10" fill="rgba(255,255,255,.92)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="245" y="228" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#8a5a2b" font-weight="700"><tspan x="245" dy="0">類地行星</tspan></text><text x="245" y="256.6" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="245" dy="0">水星、金星、地球、火星</tspan><tspan x="245" dy="15.600000000000001">體積小、密度大（約 5 g/cm³）</tspan><tspan x="245" dy="15.600000000000001">由岩石與金屬組成，有固體表面</tspan><tspan x="245" dy="15.600000000000001">衛星少或沒有</tspan></text><rect x="420" y="210" width="380" height="110" rx="10" fill="rgba(255,255,255,.92)" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="610" y="228" font-size="14" text-ancho