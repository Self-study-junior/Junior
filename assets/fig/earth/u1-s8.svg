<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="760" height="300" fill="#fffdf8"/><rect x="20" y="20" width="350" height="260" rx="10" fill="#fff" stroke="#b9b2a3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="20" width="350" height="40" rx="10" fill="#ebe3f6" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="40" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="195" dy="0">泥砂沉積量 ＞ 侵蝕量</tspan></text><text x="195" y="76.6" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="195" dy="0">例：坡地開發、濫伐</tspan><tspan x="195" dy="16.900000000000002">→ 河川泥砂量變多</tspan></text><path d="M50 180 L275 180 L315 240 L50 240Z" fill="#c9b07a" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M275 180 L340 180 L340 240 L315 240Z" fill="#7fb3dd" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 180 L110 140 L160 180Z" fill="#7cb36a" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M250 165L313.7 165" fill="none" stroke="#e08a2c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 165L310.6 169.8L310.6 160.2Z" fill="#e08a2c"/><text x="290" y="150" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#e08a2c" font-weight="700"><tspan x="290" dy="0">海退</tspan></text><text x="195" y="262" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="195" dy="0">陸地增加，海岸線向海推進</tspan></text><rect x="390" y="20" width="350" height="260" rx="10" fill="#fff" stroke="#b9b2a3" stroke-width="1" stroke-linecap="round