<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="760" height="330" fill="#fffdf8"/><path d="M40 290 C150 200 280 80 380 70 C470 75 600 180 720 290Z" fill="#cfe3b4" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 300 L300 40" fill="none" stroke="#d8b67a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 300 L370 40" fill="none" stroke="#b98f62" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M200 300 L440 40" fill="none" stroke="#e3cc9a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M270 300 L510 40" fill="none" stroke="#a77d55" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M340 300 L580 40" fill="none" stroke="#d8b67a" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M410 300 L650 40" fill="none" stroke="#b98f62" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 290 C150 200 280 80 380 70 C470 75 600 180 720 290 L760 290 L760 0 L0 0 L0 290Z" fill="#fffdf8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="290" width="760" height="40" rx="0" fill="#fffdf8" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 290 C150 200 280 80 380 70 C470 75 600 180 720 290" fill="none" stroke="#5d8a45" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 290L760 290" fill="none" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 130L136.4 223.6" fill="none" stroke="#d0505f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M130 230L134.6 215.7L144.3 225.4Z" fill="#d0505f"/><text x="110" y="30" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#d0505f" font-weight="700"><tspan x="110" dy="0">順向坡</tspan></text><text x="110" y="64.4" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="110" dy="0">坡面與岩層傾斜方向相同</tspan><tspan x="110" dy="15.600000000000001">岩層容易沿層面滑動</tspan><tspan x="110" dy="15.600000000000001">→ 較易發生山崩</tspan></text><text x="650" y="80" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#2f8a63" font-weight="700"><tspan x="650" dy="0">逆向坡</tspan></text><text x="650" y="112.2" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="650" dy="0">坡面與岩層傾斜方向相反</tspan><tspan x="650" dy="15.600000000000001">較穩定，但仍可能落石</tspan></text><path d="M400 40L304.6 97.2" fill="none" stroke="#1f2630" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M300 100L304.8 92.4L309 99.4Z" fill="#1f2630"/><text x="470" y="30" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="470" dy="0">岩層傾斜方向</tspan></text><rect x="110" y="262" width="30" height="24" rx="2" fill="#c97a4a" stroke="#8b4a2a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M105 262 L125 248 L145 262Z" fill="#8b4a2a" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="315" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1a8a96" font-weight="700"><tspan x="380" dy="0">山坡地開發、豪雨使岩層含水量增加，都會提高山崩與土石流的風險</tspan></text></svg>