<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" width="780" height="360" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="780" height="360" fill="#fffdf8"/><text x="20" y="35" font-size="16" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="20" dy="0">日食：太陽－月球－地球排成一直線</tspan></text><circle cx="70" cy="90" r="45" fill="#f7b733" stroke="#e08a2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="90" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="70" dy="0">太陽</tspan></text><path d="M70 45 L560 60 L560 120 L70 135Z" fill="#fff3c4" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><path d="M360 79 L570 86 L570 94 L360 101Z" fill="#555" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/><circle cx="560" cy="90" r="30" fill="#4f94cf" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="138" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="560" dy="0">地球</tspan></text><circle cx="360" cy="90" r="11" fill="#888" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="120" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="360" dy="0">月球</tspan></text><text x="760" y="130.2" font-size="12" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="760" dy="0">發生在新月（朔）</tspan><tspan x="760" dy="15.600000000000001">白天、月影所到之處才看得到</tspan></text><text x="20" y="195" font-size="16" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="20" dy="0">月食：太陽－地球－月球排成一直線</tspan></text><circle cx="70" cy="250" r="45" fill="#f7b733" stroke="#e08a2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="70" y="250" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="70" dy="0">太陽</tspan></text><path d="M70 205 L420 220 L420 280 L70 295Z" fill="#fff3c4" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/><path d="M420 220 L650 240 L650 260 L420 280Z" fill="#555" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/><circle cx="420" cy="250" r="30" fill="#4f94cf" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="420" y="298" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="420" dy="0">地球</tspan></text><circle cx="600" cy="250" r="11" fill="#a3443a" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="280" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="600" dy="0">月球</tspan></text><text x="760" y="290.2" font-size="12" text-anchor="end" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="760" dy="0">發生在滿月（望）</tspan><tspan x="760" dy="15.600000000000001">夜晚、面向月球的半球都看得到</tspan></text><text x="390" y="345" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1a8a96" font-weight="700"><tspan x="390" dy="0">月球公轉軌道與地球公轉軌道約有 5° 夾角，所以不是每個月都會發生日食、月食</tspan></text></svg>