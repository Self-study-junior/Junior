l="#3b6fb6" font-weight="700"><tspan x="380" dy="0">地下水面</tspan></text><path d="M245 120L110 40" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="245" cy="120" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="40" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="110" dy="0">水井：須挖到地下水面以下</tspan></text><path d="M515 160L470 40" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="515" cy="160" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="32.2" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="470" dy="0">湖泊、河流：地下水面</tspan><tspan x="470" dy="15.600000000000001">高於地表處</tspan></text><path d="M640 128L670 50" fill="none" stroke="#646b72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><circle cx="640" cy="128" r="2.2" fill="#646b72" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="670" y="42.2" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="670" dy="0">泉水：地下水面與</tspan><tspan x="670" dy="15.600000000000001">地表相交處湧出</tspan></text><text x="390" y="330" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700"><tspan x="390" dy="0">不透水層（如頁岩、黏土層）：孔隙小，阻擋地下水往下流</tspan></text><text x="640" y="222.2" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="640" dy="0">透水層：砂岩、礫岩</tspan><tspan x="640" dy="15.600000000000001">孔隙大，容易儲存地下水</tspan></text></svg>