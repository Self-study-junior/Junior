<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" width="780" height="320" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Heiti TC','WenQuanYi Zen Hei',sans-serif" font-size="14" fill="#1f2630"><rect width="780" height="320" fill="#fffdf8"/><path d="M40 250 L360 250 L360 210 L40 210Z" fill="#e7d39b" stroke="#8a6a45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 210 L360 210 L360 170 L40 170Z" fill="#c9b8a3" stroke="#8a6a45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 170 L360 170 L360 130 L40 130Z" fill="#efe1b7" stroke="#8a6a45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 130 L360 130 L360 90 L40 90Z" fill="#bfa98a" stroke="#8a6a45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 90 L360 90 L360 50 L40 50Z" fill="#e2cf9a" stroke="#8a6a45" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="230" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="80" dy="0">A</tspan></text><text x="80" y="190" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="80" dy="0">B</tspan></text><text x="80" y="150" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="80" dy="0">C</tspan></text><text x="80" y="110" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="80" dy="0">D</tspan></text><text x="80" y="70" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="80" dy="0">E</tspan></text><path d="M200 250 L215 150 L230 120 L245 150 L250 250Z" fill="#e46b4f" stroke="#9a3a26" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="225" y="215" font-size="15" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700"><tspan x="225" dy="0">F</tspan></text><path d="M300 50 L330 250" fill="none" stroke="#1f2630" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M290 160L285.8 134.9" fill="none" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M285 130L289.9 136.6L282.5 137.9Z" fill="#1f2630"/><path d="M340 130L344.2 155.1" fill="none" stroke="#1f2630" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M345 160L340.1 153.4L347.5 152.1Z" fill="#1f2630"/><text x="320" y="280" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="320" dy="0">斷層 G</tspan></text><path d="M40 50 C120 40 200 60 360 45" fill="none" stroke="#5a3e2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="200" y="30" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="200" dy="0">侵蝕面</tspan></text><text x="410" y="50" font-size="13" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="410" dy="0">疊置定律：未受擾動的地層，下面先沉積、上面後沉積</tspan></text><text x="410" y="85" font-size="13" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="410" dy="0">→ 先後順序 A → B → C → D → E</tspan></text><text x="410" y="130" font-size="13" text-anchor="start" dominant-baseline="central" fill="#1f2630" font-weight="400"><tspan x="410" dy="0">截切定律：切過其他岩層的構造比被切的岩層新</tspan></text><text x="410" y="165" font-size="13" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="410" dy="0">→ 火成岩 F 切過 A～C，比 C 新</tspan></text><text x="410" y="195" font-size="13" text-anchor="start" dominant-baseline="central" fill="#646b72" font-weight="400"><tspan x="410" dy="0">→ 斷層 G 切過所有地層，最晚發生</tspan></text><rect x="410" y="225" width="350" height="60" rx="8" fill="#d7eef0" stroke="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="585" y="255" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1f2630" font-weight="700"><tspan x="585" dy="0">化石可用來判斷地層年代與當時的環境</tspan></text></svg>