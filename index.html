    <span class="kicker">116 會考 · 自學重點筆記</span>
    <h1>把課本讀<em>薄</em>，<br>把觀念讀<em>透</em>。</h1>
    <p class="lead">依單元整理的重點筆記：每單元有核心觀念、易混淆比較、關鍵名詞卡，歷史附年代軸與史料線索，自然科附重要實驗。手機、平板、電腦都能讀。</p>
    <label class="search">

  <section class="how">
    <div><h4>先看單元總覽</h4><p>每單元開頭的摘要告訴你會考常考什麼，先抓方向再讀細節。</p></div>
    <div><h4>易混淆觀念</h4><p>兩兩對照的表格加上「判斷關鍵」，專治看起來都對的選項。</p></div>
    <div><h4>遮住定義自我測驗</h4><p>關鍵名詞卡可以一鍵遮住定義，點一下翻開，邊讀邊考自己。</p></div>
    <div><h4>可以列印</h4><p>每個單元頁面都排好列印版面，印出來就是一份精華講義。</p></div>
