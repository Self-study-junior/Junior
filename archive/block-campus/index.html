<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>方塊校園．國中自學筆記</title>
<meta name="description" content="用 3D 方塊世界逛國中自學筆記：建立自己的角色，走進各科的館閱讀重點筆記。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2630'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23f6f4ee' font-family='serif' font-weight='900'%3E學%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
:root{--ink:#1f2630;--paper:#f6f4ee;--mc:#c6c6c6;--mc-d:#555;--mc-l:#fff;--accent:#5fbf4a;--bg:#9fd3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas#scene{display:block;width:100vw;height:100vh;touch-action:none}
[hidden]{display:none!important}
.mcbtn{font:inherit;font-weight:700;color:#fff;text-shadow:2px 2px 0 #3f3f3f;background:#7d7d7d;border:2px solid #000;box-shadow:inset 2px 2px 0 #b4b4b4,inset -2px -3px 0 #4c4c4c;padding:8px 16px;cursor:pointer;image-rendering:pixelated}
.mcbtn:hover{background:#8f9ad6;box-shadow:inset 2px 2px 0 #c9cff0,inset -2px -3px 0 #5a63a3}
.mcbtn.go{background:#5a9e3a;box-shadow:inset 2px 2px 0 #8fd56b,inset -2px -3px 0 #366b20}
.mcbtn.go:hover{background:#6bb846}
.panel{background:rgba(20,22,28,.78);color:#fff;border:2px solid #000;box-shadow:inset 0 0 0 2px #5a5a5a}
/* HUD */
.hud{position:fixed;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
#top{left:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100vw - 190px)}
#top .title{padding:6px 12px;font-weight:900;font-size:16px;text-shadow:2px 2px 0 #000}
#top a{text-decoration:none;font-size:14px}
#mini{right:12px;top:12px;width:160px;height:160px}
#mini canvas{width:100%;height:100%;display:block}
#help{left:12px;bottom:12px;padding:8px 12px;font-size:13px;line-height:1.7;max-width:330px}
#help b{color:#ffe36b}
#prompt{left:50%;bottom:18%;transform:translateX(-50%);padding:12px 18px;text-align:center;min-width:260px}
#prompt .n{font-size:22px;font-weight:900;text-shadow:2px 2px 0 #000}
#prompt .d{font-size:14px;opacity:.85;margin:2px 0 10px}
#warp{right:12px;top:184px;width:160px;padding:8px;font-size:13px}
#warp summary{cursor:pointer;font-weight:700;font-size:13px;color:#ffe36b;margin-bottom:4px;list-style-position:inside}
#warp button{display:block;width:100%;text-align:left;margin:3px 0;font-size:13px;padding:5px 8px}
#warp button i{font-style:normal;display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:1px solid #000}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
/* 觸控 */
#stick{left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.5);touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(255,255,255,.75)}
#tbtns{right:20px;bottom:30px;display:flex;flex-direction:column;gap:10px}
#tbtns button{width:70px;height:70px;font-size:15px}
/* 角色建立 */
#start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:linear-gradient(#77b9ec,#bfe3ff 60%,#7fbf5a 60%,#5e9e3c);padding:16px;overflow:auto}
#start .box{width:min(640px,100%);padding:22px 22px 18px}
#start h1{margin:0 0 4px;font-size:clamp(24px,5vw,34px);font-weight:900;text-shadow:3px 3px 0 #000;letter-spacing:.04em}
#start p.s{margin:0 0 14px;opacity:.9;font-size:14px}
.pick{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
#avatar{width:150px;height:200px;background:rgba(0,0,0,.25);border:2px solid #000}
.opts h4{margin:6px 0 4px;font-size:13px;color:#ffe36b}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border:2px solid #000;cursor:pointer;padding:0;box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.35)}
.sw button[aria-pressed="true"]{outline:3px solid #ffe36b;outline-offset:1px}
#nm{font:inherit;font-size:15px;width:100%;padding:8px 10px;border:2px solid #000;background:#111;color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.row a{color:#cfe3ff;font-size:13px}
.keys{font-size:12.5px;opacity:.85;margin-top:12px;line-height:1.7}
#nogl{position:fixed;inset:0;z-index:40;background:var(--paper);padding:24px;overflow:auto}
#nogl a{display:block;margin:8px 0;font-size:18px}
@media (max-width:640px){
  .pick{grid-template-columns:1fr}
  #avatar{width:120px;height:160px;margin:0 auto;display:block}
  #help{display:none}
  #mini{width:110px;height:110px}
  #warp{top:132px;width:130px;padding:6px}
  #warp:not([open]){width:auto}
  #warp button{font-size:12px;padding:4px 6px}
  #prompt{bottom:190px;min-width:0;width:min(260px,calc(100vw - 24px));padding:8px 12px}
  #prompt .mcbtn{padding:6px 14px}
  #top .mcbtn{padding:5px 9px;font-size:13px}
  #prompt .d{display:none}
  #prompt .n{font-size:18px}
  #top{max-width:calc(100vw - 140px)}
  #top .title{font-size:14px}
}
</style>
<script src="../../assets/subjects.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud" id="top">
  <span class="panel title">⛏ 方塊校園（已封存）</span>
  <a class="mcbtn" href="../../">回一般首頁</a>
  <button class="mcbtn" id="reskin">換角色</button>
</div>
<div class="hud panel" id="mini"><canvas width="320" height="320"></canvas></div>
<details class="hud panel" id="warp" open><summary>直接傳送</summary><div id="warpList"></div></details>
<div class="hud panel" id="help">
  <b>WASD／方向鍵</b> 走路　<b>Shift</b> 跑步　<b>空白鍵</b> 跳<br>
  <b>拖曳滑鼠</b> 轉視角　<b>滾輪</b> 拉近拉遠<br>
  走進建築的<b>傳送門</b>，或靠近後按 <b>E</b> 進入科目
</div>
<div class="hud panel" id="prompt" hidden><div class="n" id="pn"></div><div class="d" id="pd"></div><button class="mcbtn go" id="pgo">進入（E）</button></div>
<div class="hud" id="stick" hidden><i></i></div>
<div class="hud" id="tbtns" hidden><button class="mcbtn" id="tjump">跳</button></div>
<div id="fade"></div>

<div id="start">
  <div class="box panel">
    <h1>國中自學筆記．方塊校園</h1>
    <p class="s">建立你的角色，走進各科的館開始讀筆記。</p>
    <div class="pick">
      <canvas id="avatar" width="300" height="400"></canvas>
      <div class="opts">
        <h4>名字</h4><input id="nm" maxlength="10" placeholder="輸入你的名字">
        <h4>膚色</h4><div class="sw" data-k="skin"></div>
        <h4>髮色</h4><div class="sw" data-k="hair"></div>
        <h4>上衣</h4><div class="sw" data-k="shirt"></div>
        <h4>褲子</h4><div class="sw" data-k="pants"></div>
      </div>
    </div>
    <div class="row"><button class="mcbtn go" id="play">開始探索</button><button class="mcbtn" id="rand">隨機外觀</button><a href="../../">不玩了，直接看筆記 →</a></div>
    <div class="keys">電腦：WASD／方向鍵走路、拖曳滑鼠轉視角、空白鍵跳、E 進入。手機：左下搖桿走路、右側拖曳轉視角。</div>
  </div>
</div>
<div id="nogl" hidden></div>

<script type="module" src="./world.js"></script>
</body>
</html>
